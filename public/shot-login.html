<!doctype html>
<html><head><meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#000;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .primary{color:#276EF1}
  .bg-primary{background:#276EF1}
</style>
</head>
<body>
<div style="width:390px;height:844px;background:#000;display:flex;flex-direction:column;overflow:hidden">
  <!-- HERO -->
  <div style="min-height:40%;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:52px 24px 0">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#276EF1" stroke="#276EF1" stroke-width="2" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span style="color:#fff;font-weight:700;font-size:18px;letter-spacing:-.02em">freelaki</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px 40px">
      <h1 style="line-height:1.1;font-size:42px;margin:0">
        <span style="color:#fff;font-weight:300">Suas</span><br/>
        <span style="color:#276EF1;font-weight:800">oportunidades</span><br/>
        <span style="color:#fff;font-weight:300">te esperam.</span>
      </h1>
      <p style="margin-top:12px;color:#9CA3AF;font-size:14px;font-weight:300">Faça login e fique online.</p>
    </div>
  </div>
  <!-- CARD -->
  <div style="flex:1;background:#fff;border-radius:28px 28px 0 0;padding:32px 24px;margin-top:-8px">
    <div style="font-size:11px;font-weight:600;letter-spacing:2px;color:#6B7280">ACESSE SUA CONTA</div>
    <div style="margin-top:20px">
      <div style="font-size:14px;font-weight:500;color:#0F172A;margin-bottom:6px">Email</div>
      <div style="height:52px;border:1px solid #E5E7EB;border-radius:8px;display:flex;align-items:center;padding:0 16px;font-size:16px;color:#0F172A">profissional@freelaki.com</div>
    </div>
    <div style="margin-top:16px">
      <div style="font-size:14px;font-weight:500;color:#0F172A;margin-bottom:6px">Senha</div>
      <div style="height:52px;border:2px solid #276EF1;border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:18px;color:#0F172A">
        <span style="letter-spacing:3px">••••••••••</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:8px">
      <span style="color:#276EF1;font-size:13px;font-weight:500">Esqueci minha senha</span>
    </div>
    <button style="margin-top:28px;height:54px;width:100%;background:#276EF1;color:#fff;font-weight:700;font-size:16px;border:0;border-radius:14px">Entrar →</button>
    <button style="margin-top:12px;height:54px;width:100%;background:#F7F7F7;color:#0F172A;font-weight:600;font-size:16px;border:0;border-radius:14px">Criar conta</button>
    <p style="margin-top:20px;text-align:center;font-size:12px;color:#6B7280">Ao continuar, você aceita os <span style="color:#276EF1;text-decoration:underline">Termos de Uso</span></p>
  </div>
</div>
</body></html>
