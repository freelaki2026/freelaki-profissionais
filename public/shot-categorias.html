<!doctype html>
<html><head><meta charset="utf-8"/>
<style>html,body{margin:0;background:#000;font-family:Arial,sans-serif;-webkit-font-smoothing:antialiased}
.tile{position:relative;aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.icon{width:30px;height:30px;color:#0F172A}
.sel .icon{color:#276EF1}
.dis .icon{opacity:.45;color:#9CA3AF}
.name{margin-top:8px;text-align:center;font-size:11px;line-height:1.15;font-weight:500;color:#0F172A}
.sel .name{color:#276EF1;font-weight:600}
.dis .name{color:#9CA3AF;font-size:10px}
.check{position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:9999px;background:#276EF1;display:flex;align-items:center;justify-content:center;color:#fff}
</style>
</head>
<body>
<div style="width:390px;height:844px;background:#000;display:flex;flex-direction:column;overflow:hidden;font-family:Arial,sans-serif">
  <div style="padding:56px 28px 32px">
    <div style="display:flex;align-items:center;gap:8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#276EF1" stroke="#276EF1" stroke-width="2" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span style="color:#fff;font-weight:700;font-size:18px;font-family:Arial,sans-serif">freelaki</span>
    </div>
    <h1 style="margin:20px 0 0;line-height:1.05;font-family:Arial,sans-serif">
      <span style="display:block;color:#fff;font-size:36px;font-weight:300">Em que você</span>
      <span style="display:block;color:#276EF1;font-size:36px;font-weight:800">atua?</span>
    </h1>
    <p style="margin-top:8px;color:#9CA3AF;font-size:13px">Selecione ao menos uma categoria.</p>
  </div>
  <div style="flex:1;background:#fff;border-radius:28px 28px 0 0;padding:24px 20px">
    <div style="font-size:11px;font-weight:600;letter-spacing:2px;color:#6B7280">SUAS ESPECIALIDADES</div>
    <div id="grid" style="margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px"></div>
  </div>
</div>
<script>
const ic = {
  camera: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  video: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',
  mic: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10a7 7 0 0 1-14 0"/><line x1="12" y1="19" x2="12" y2="23"/></svg>',
  headphones: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-7h3zM3 19a2 2 0 0 0 2 2h1v-7H3z"/></svg>',
  guitar: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6"/><path d="M11 7l6 6"/><circle cx="9" cy="15" r="5"/><circle cx="9" cy="15" r="1.5" fill="currentColor"/></svg>',
  sparkle: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><path d="M19 14v4M17 16h4"/></svg>',
  scissors: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>',
  utensils: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7a3 3 0 0 0 3 3v10"/><path d="M9 2v20"/><path d="M16 2v9a4 4 0 0 0 2 3.5V22h-2"/></svg>',
  chef: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14a4 4 0 1 1 4-7 4 4 0 1 1 4 0 4 4 0 1 1 4 7v3a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-3z"/></svg>',
  palette: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5" fill="currentColor"/><circle cx="17.5" cy="10.5" r="1.5" fill="currentColor"/><circle cx="8.5" cy="7.5" r="1.5" fill="currentColor"/><circle cx="6.5" cy="12.5" r="1.5" fill="currentColor"/><path d="M12 2a10 10 0 1 0 10 10c0-2-2-3-4-3h-2a3 3 0 0 1-3-3v-1c0-1.5-1-3-1-3z"/></svg>',
  car: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M5 17l1.5-5h11L19 17M5 17v3M19 17v3M7 12V8a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v4"/><circle cx="8" cy="17" r="1.5" fill="currentColor"/><circle cx="16" cy="17" r="1.5" fill="currentColor"/></svg>',
  check: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
};
const cats = [
  {i:'camera',n:'Fotografia',sel:true},
  {i:'video',n:'Filmagem',sel:true},
  {i:'mic',n:'Locução',sel:false},
  {i:'headphones',n:'DJ',sel:true},
  {i:'guitar',n:'Música ao vivo',sel:false},
  {i:'sparkle',n:'Maquiagem',sel:false},
  {i:'scissors',n:'Cabelereiro',sel:false},
  {i:'utensils',n:'Garçom',sel:true},
  {i:'chef',n:'Chef',sel:false},
  {i:'palette',n:'Design',sel:false},
  {i:'car',n:'Motorista',sel:false},
  {i:'sparkle',n:'Em breve mais categorias',disabled:true},
];
const grid = document.getElementById('grid');
cats.forEach(c=>{
  const sel=c.sel, dis=c.disabled;
  const cls = 'tile ' + (sel?'sel':'') + (dis?' dis':'');
  const border = dis ? '1px dashed #E5E7EB' : (sel?'2px solid #276EF1':'1px solid #E5E7EB');
  const bg = dis ? 'rgba(229,231,235,.4)' : (sel?'rgba(39,110,241,.06)':'#fff');
  const check = sel ? `<div class="check">${ic.check}</div>` : '';
  grid.insertAdjacentHTML('beforeend', `<div class="${cls}" style="border:${border};background:${bg}">${check}${ic[c.i]}<div class="name">${c.n}</div></div>`);
});
</script>
</body></html>
