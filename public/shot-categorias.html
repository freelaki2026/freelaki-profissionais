<!doctype html>
<html><head><meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}</style>
</head>
<body>
<div style="width:390px;height:844px;background:#000;display:flex;flex-direction:column;overflow:hidden">
  <!-- HEADER -->
  <div style="padding:56px 28px 32px">
    <div style="display:flex;align-items:center;gap:8px">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#276EF1" stroke="#276EF1" stroke-width="2" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span style="color:#fff;font-weight:700;font-size:18px">freelaki</span>
    </div>
    <h1 style="margin:20px 0 0;line-height:1.05">
      <span style="display:block;color:#fff;font-size:36px;font-weight:300">Em que você</span>
      <span style="display:block;color:#276EF1;font-size:36px;font-weight:800">atua?</span>
    </h1>
    <p style="margin-top:8px;color:#9CA3AF;font-size:13px">Selecione ao menos uma categoria.</p>
  </div>
  <!-- WHITE CARD -->
  <div style="flex:1;background:#fff;border-radius:28px 28px 0 0;padding:24px 20px">
    <div style="font-size:11px;font-weight:600;letter-spacing:2px;color:#6B7280">SUAS ESPECIALIDADES</div>
    <div id="grid" style="margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px"></div>
  </div>
</div>
<script>
const cats = [
  {e:'📸',n:'Fotografia',sel:true},
  {e:'🎥',n:'Filmagem',sel:true},
  {e:'🎤',n:'Locução',sel:false},
  {e:'🎧',n:'DJ',sel:true},
  {e:'🎸',n:'Música ao vivo',sel:false},
  {e:'💄',n:'Maquiagem',sel:false},
  {e:'💇',n:'Cabelereiro',sel:false},
  {e:'🍽️',n:'Garçom',sel:true},
  {e:'🍳',n:'Chef',sel:false},
  {e:'🎨',n:'Design',sel:false},
  {e:'🚗',n:'Motorista',sel:false},
  {e:'✨',n:'Em breve mais categorias',disabled:true},
];
const grid = document.getElementById('grid');
cats.forEach(c=>{
  const sel = c.sel;
  const dis = c.disabled;
  const border = dis ? '1px dashed #E5E7EB' : (sel ? '2px solid #276EF1' : '1px solid #E5E7EB');
  const bg = dis ? 'rgba(229,231,235,.4)' : (sel ? 'rgba(39,110,241,.06)' : '#fff');
  const nameColor = dis ? '#9CA3AF' : (sel ? '#276EF1' : '#0F172A');
  const nameWeight = sel ? 600 : 500;
  const fontSize = dis ? 10 : 11;
  const check = sel ? `<div style="position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:9999px;background:#276EF1;display:flex;align-items:center;justify-content:center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>` : '';
  grid.insertAdjacentHTML('beforeend', `
    <div style="position:relative;aspect-ratio:1;border:${border};background:${bg};border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px">
      ${check}
      <div style="font-size:28px;${dis?'opacity:.5':''}">${c.e}</div>
      <div style="margin-top:6px;text-align:center;font-size:${fontSize}px;line-height:1.15;font-weight:${nameWeight};color:${nameColor}">${c.n}</div>
    </div>`);
});
</script>
</body></html>
