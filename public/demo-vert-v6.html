<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Vertical</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { margin:0; font-family:'Inter',sans-serif; background:#000; }
  .vframe { width:414px; height:896px; position:relative; overflow:hidden; }
  .scroll-hide::-webkit-scrollbar { display:none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @keyframes pulseRing { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.6);opacity:0} }
  .pulse-dot { animation: pulse 1.6s ease-in-out infinite; }
  .ph { width:300px; height:600px; border-radius:42px; overflow:hidden; position:relative; box-shadow:0 50px 100px -15px rgba(0,0,0,0.7), 0 0 0 10px #1a1a1f, 0 0 0 12px #2a2a30; }
  .pin { width:34px; height:34px; border-radius:50% 50% 50% 0; background:#276EF1; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.4); border:2px solid white; }
  .pin span { transform:rotate(45deg); font-size:13px; }
  .pin-pulse { position:absolute; inset:-8px; border-radius:50%; background:#276EF1; animation: pulseRing 2s ease-out infinite; z-index:-1; }
  .leaflet-container { background:#0a0a0f; }
  .stat-svg svg { fill:currentColor; }
</style>
</head>
<body>
<!-- Each section is 414x896, body lays them vertically -->

<!-- 1) OPORTUNIDADES -->
<section class="vframe" id="v6" style="background:linear-gradient(180deg,#000 0%,#0a0e1a 50%,#000 100%);">
  <div class="absolute -top-32 -right-32 w-[400px] h-[400px] rounded-full" style="background:radial-gradient(circle,rgba(250,204,21,0.22),transparent 70%);"></div>
  <div class="absolute -bottom-32 -left-32 w-[400px] h-[400px] rounded-full" style="background:radial-gradient(circle,rgba(59,130,246,0.3),transparent 70%);"></div>
  <div class="relative h-[260px] px-10 pt-12 flex flex-col items-center text-center">
    <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[11px] font-bold text-white" style="background:rgba(250,204,21,0.2); border:1px solid rgba(250,204,21,0.5);">
      📍 RAIO DE 5 KM
    </span>
    <h1 class="text-white font-black tracking-tight leading-[0.95] mt-3" style="font-size:42px;">Veja todos<br/>os freelas<br/><span style="background:linear-gradient(90deg,#facc15,#60a5fa); -webkit-background-clip:text; background-clip:text; color:transparent;">ao seu redor.</span></h1>
  </div>
  <div class="absolute left-1/2 -translate-x-1/2 bottom-6 ph" style="background:#000;">
    <div class="absolute top-0 left-0 right-0 flex justify-between items-center px-5 pt-3 pb-1 text-[12px] font-semibold text-white" style="background:linear-gradient(180deg,rgba(0,0,0,0.5),transparent); z-index:1100;">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <svg width="14" height="10" viewBox="0 0 16 11" fill="white"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4" y="5" width="3" height="6" rx="1"/><rect x="8" y="2" width="3" height="9" rx="1"/><rect x="12" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="22" height="11" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="2.5" stroke="white" fill="none"/><rect x="2.5" y="2.5" width="18" height="7" rx="1.5" fill="white"/></svg>
      </div>
    </div>
    <div id="map" style="width:100%;height:100%;"></div>
    <div class="absolute top-9 left-3 right-3" style="z-index:1000;">
      <div class="rounded-2xl p-2.5 flex items-center gap-2" style="background:rgba(11,11,15,0.85); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.08);">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-base" style="background:rgba(39,110,241,0.2);">📍</div>
        <div class="flex-1 min-w-0">
          <p class="text-white text-[12px] font-bold leading-tight">Vila Madalena, SP</p>
          <p class="text-white/50 text-[9px]">12 oportunidades em 3 km</p>
        </div>
        <div class="px-2 py-0.5 rounded-full text-[9px] font-bold flex items-center gap-1" style="background:rgba(34,197,94,0.2); color:#4ade80;">
          <span class="w-1 h-1 rounded-full bg-emerald-400"></span> AO VIVO
        </div>
      </div>
    </div>
    <div class="absolute bottom-0 left-0 right-0 rounded-t-3xl p-3.5" style="z-index:1000; background:#0B0B0F; border-top:1px solid rgba(255,255,255,0.08);">
      <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-2"></div>
      <div class="flex items-center gap-2 mb-2">
        <span class="px-2 py-0.5 rounded-md text-[8px] font-bold uppercase" style="background:rgba(245,158,11,0.2); color:#fbbf24;">⚡ Mais próximo</span>
        <span class="text-white/40 text-[9px]">há 2 min</span>
      </div>
      <h3 class="text-white text-[13px] font-extrabold leading-tight">Ensaio externo · Casal</h3>
      <p class="text-white/50 text-[10px] mt-0.5">📷 Fotógrafo · 0,8 km · Sáb 16h</p>
      <div class="flex items-center justify-between mt-2.5 pt-2.5 border-t border-white/10">
        <div>
          <p class="text-[8px] text-white/40 uppercase font-bold">Você recebe</p>
          <p class="text-white text-[17px] font-extrabold leading-none">R$ 680</p>
        </div>
        <button class="px-4 py-2 rounded-xl text-[11px] font-bold text-white" style="background:#276EF1;">Ver →</button>
      </div>
    </div>
  </div>
</section>

<script>
  // Map initialization for v6
  setTimeout(() => {
    const mapDiv = document.getElementById('map');
    if (!mapDiv) return;
    const map = L.map('map', { zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false }).setView([-23.5475, -46.6925], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { subdomains:'abcd', maxZoom:19 }).addTo(map);
    const userIcon = L.divIcon({ className:'', html:'<div style="position:relative;width:22px;height:22px;"><div style="position:absolute;inset:0;background:#276EF1;border-radius:50%;border:3px solid white;box-shadow:0 0 0 4px rgba(39,110,241,.3),0 4px 12px rgba(0,0,0,.5);"></div></div>', iconSize:[22,22], iconAnchor:[11,11] });
    L.marker([-23.5475, -46.6925], {icon:userIcon}).addTo(map);
    const opps = [
      { lat:-23.5450, lng:-46.6900, icon:'📷' },
      { lat:-23.5500, lng:-46.6970, icon:'🎬' },
      { lat:-23.5430, lng:-46.6960, icon:'📱' },
      { lat:-23.5510, lng:-46.6880, icon:'📣' },
      { lat:-23.5460, lng:-46.6850, icon:'✨' },
      { lat:-23.5520, lng:-46.6920, icon:'🎨' },
      { lat:-23.5440, lng:-46.6990, icon:'📷' },
      { lat:-23.5490, lng:-46.6840, icon:'🎬' },
      { lat:-23.5410, lng:-46.6920, icon:'📷' },
      { lat:-23.5490, lng:-46.7000, icon:'📣' },
      { lat:-23.5530, lng:-46.6960, icon:'📱' },
      { lat:-23.5420, lng:-46.6870, icon:'✨' },
    ];
    opps.forEach(o => {
      const html = `<div style="position:relative;"><div class="pin-pulse"></div><div class="pin"><span>${o.icon}</span></div></div>`;
      const icon = L.divIcon({ className:'', html, iconSize:[34,40], iconAnchor:[17,40] });
      L.marker([o.lat,o.lng], {icon}).addTo(map);
    });
  }, 200);
</script>


</body>
</html>
