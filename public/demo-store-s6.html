<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Screenshot</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:'Inter',sans-serif; background:#000; }
  .frame { width:1280px; height:720px; position:relative; overflow:hidden; }
  .scroll-hide::-webkit-scrollbar { display:none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .pulse-dot { animation: pulse 1.6s ease-in-out infinite; }
  .ph { width:340px; height:660px; border-radius:48px; overflow:hidden; position:relative; box-shadow:0 60px 120px -20px rgba(0,0,0,0.6), 0 0 0 12px #1a1a1f, 0 0 0 14px #2a2a30; }
</style>
</head>
<body>

<!-- =================== 1) OPORTUNIDADES =================== -->
<div class="frame" id="s6" style="background:linear-gradient(135deg,#000 0%,#0a0e1a 50%,#000 100%);">
  <div class="absolute -top-32 -right-32 w-[500px] h-[500px] rounded-full" style="background:radial-gradient(circle,rgba(250,204,21,0.2),transparent 70%);"></div>
  <div class="absolute -bottom-32 -left-32 w-[500px] h-[500px] rounded-full" style="background:radial-gradient(circle,rgba(59,130,246,0.25),transparent 70%);"></div>

  <div class="absolute left-16 top-0 bottom-0 w-[600px] flex flex-col justify-center">
    <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[12px] font-bold text-white w-fit" style="background:rgba(250,204,21,0.18); border:1px solid rgba(250,204,21,0.4);">
      📍 RAIO DE 5 KM
    </span>
    <h1 class="text-white font-black tracking-tight leading-[0.95] mt-5" style="font-size:68px;">Veja todos<br/>os freelas<br/><span style="background:linear-gradient(90deg,#facc15,#60a5fa); -webkit-background-clip:text; background-clip:text; color:transparent;">ao seu redor.</span></h1>
    <p class="text-white/60 text-[19px] mt-6 leading-relaxed max-w-md">Mapa em tempo real com oportunidades das suas categorias, distância e valor à vista.</p>
  </div>

  <!-- Phone with embedded map iframe -->
  <div class="absolute right-12 top-1/2 -translate-y-1/2 ph" style="background:#000;">
    <iframe src="/demo-mapa-real.html" style="width:340px;height:660px;border:0;display:block;"></iframe>
  </div>
</div>



</body>
</html>
