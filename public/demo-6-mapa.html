<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Mapa</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:'Inter',sans-serif; background:#0B0B0F; }
  @keyframes pulse-ring {
    0% { transform: scale(0.8); opacity: 0.7; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  .pulse-ring { animation: pulse-ring 2.4s ease-out infinite; }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.5} }
  .pulse-dot { animation: pulse-dot 1.6s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  .float { animation: float 3s ease-in-out infinite; }
</style>
</head>
<body>
<div class="min-h-screen relative overflow-hidden">
  <!-- MAP base (dark Uber-style) -->
  <div class="absolute inset-0" style="background:linear-gradient(180deg,#1a1f2e 0%,#0f1419 100%);">
    <!-- Streets grid -->
    <svg viewBox="0 0 390 844" class="absolute inset-0 w-full h-full" preserveAspectRatio="none">
      <!-- Park / blocks -->
      <rect x="20" y="120" width="120" height="80" rx="8" fill="#162033" opacity=".6"/>
      <rect x="240" y="180" width="130" height="100" rx="8" fill="#162033" opacity=".6"/>
      <rect x="40" y="450" width="100" height="120" rx="8" fill="#162033" opacity=".6"/>
      <rect x="220" y="500" width="150" height="90" rx="8" fill="#162033" opacity=".6"/>
      <rect x="60" y="680" width="180" height="100" rx="8" fill="#162033" opacity=".6"/>

      <!-- Water/park accent -->
      <path d="M-20 320 Q 100 280 200 340 T 420 310 L 420 380 Q 280 410 180 390 T -20 400 Z" fill="#0e2436" opacity=".7"/>

      <!-- Main avenues -->
      <path d="M0 280 L 390 320" stroke="#2a3346" stroke-width="14" opacity=".8"/>
      <path d="M0 280 L 390 320" stroke="#3d4860" stroke-width="1" stroke-dasharray="6 6" opacity=".5"/>

      <path d="M0 620 Q 200 600 390 640" stroke="#2a3346" stroke-width="12" opacity=".8" fill="none"/>
      <path d="M0 620 Q 200 600 390 640" stroke="#3d4860" stroke-width="1" stroke-dasharray="6 6" opacity=".5" fill="none"/>

      <!-- Vertical streets -->
      <path d="M180 0 L 200 844" stroke="#212a3d" stroke-width="10" opacity=".7"/>
      <path d="M40 0 L 60 844" stroke="#212a3d" stroke-width="6" opacity=".5"/>
      <path d="M330 0 L 350 844" stroke="#212a3d" stroke-width="8" opacity=".6"/>

      <!-- Horizontal small -->
      <path d="M0 100 L 390 110" stroke="#212a3d" stroke-width="4" opacity=".4"/>
      <path d="M0 220 L 390 230" stroke="#212a3d" stroke-width="4" opacity=".4"/>
      <path d="M0 460 L 390 470" stroke="#212a3d" stroke-width="4" opacity=".4"/>
      <path d="M0 760 L 390 770" stroke="#212a3d" stroke-width="4" opacity=".4"/>

      <!-- Route highlight (blue dashed) -->
      <path d="M195 480 Q 230 440 260 380 T 290 280" stroke="#276EF1" stroke-width="3.5" stroke-dasharray="6 5" fill="none" opacity=".9"/>
    </svg>
  </div>

  <!-- Status bar -->
  <div class="relative flex justify-between items-center px-6 pt-3 pb-1 text-[13px] font-semibold text-white">
    <span>9:41</span>
    <div class="flex items-center gap-1.5">
      <svg width="16" height="11" viewBox="0 0 16 11" fill="white"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4" y="5" width="3" height="6" rx="1"/><rect x="8" y="2" width="3" height="9" rx="1"/><rect x="12" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="2.5" stroke="white" fill="none"/><rect x="2.5" y="2.5" width="18" height="7" rx="1.5" fill="white"/></svg>
    </div>
  </div>

  <!-- Top search bar -->
  <div class="relative mx-4 mt-3 rounded-2xl flex items-center gap-3 px-4 py-3.5" style="background:rgba(255,255,255,0.97); backdrop-filter:blur(20px); box-shadow:0 10px 30px -8px rgba(0,0,0,0.5);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B0F" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <div class="flex-1">
      <p class="text-[13px] font-bold text-black">Vila Madalena, São Paulo</p>
      <p class="text-[10px] text-gray-500 font-medium">Raio de busca · 5 km</p>
    </div>
    <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#276EF1;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
    </div>
  </div>

  <!-- Stats badge -->
  <div class="relative mx-4 mt-3 inline-flex items-center gap-2 px-3 py-1.5 rounded-full" style="background:rgba(11,11,15,0.85); backdrop-filter:blur(10px); border:1px solid rgba(34,197,94,0.4);">
    <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-dot"></span>
    <span class="text-[11px] font-bold text-white">7 clientes ativos perto de você</span>
  </div>

  <!-- ===== PINS ===== -->

  <!-- YOU (center) -->
  <div class="absolute" style="left:50%; top:54%; transform:translate(-50%,-50%);">
    <div class="absolute inset-0 -m-10 rounded-full pulse-ring" style="background:radial-gradient(circle, rgba(39,110,241,0.5), transparent 70%);"></div>
    <div class="absolute inset-0 -m-10 rounded-full pulse-ring" style="background:radial-gradient(circle, rgba(39,110,241,0.4), transparent 70%); animation-delay:1.2s;"></div>
    <div class="relative w-14 h-14 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#276EF1,#1a4cb8); box-shadow:0 8px 25px -4px rgba(39,110,241,0.7), 0 0 0 4px rgba(255,255,255,0.95);">
      <span class="text-white font-extrabold text-lg">L</span>
    </div>
  </div>

  <!-- Client 1 — top-left, fotografia, R$1450 -->
  <div class="absolute float" style="left:18%; top:30%;">
    <div class="relative">
      <div class="px-2.5 py-1 rounded-lg flex items-center gap-1.5 mb-1" style="background:#0B0B0F; border:1px solid rgba(255,255,255,0.1); box-shadow:0 8px 20px -4px rgba(0,0,0,0.6);">
        <span class="text-[14px]">📸</span>
        <span class="text-white text-[11px] font-extrabold">R$ 1.450</span>
      </div>
      <div class="w-9 h-9 rounded-full flex items-center justify-center mx-auto -mt-0.5" style="background:linear-gradient(135deg,#f97316,#ea580c); box-shadow:0 6px 16px -2px rgba(249,115,22,0.6), 0 0 0 3px rgba(255,255,255,0.9);">
        <span class="text-white font-bold text-[12px]">M</span>
      </div>
      <div class="w-2 h-2 rotate-45 -mt-1 mx-auto" style="background:rgba(255,255,255,0.9);"></div>
    </div>
  </div>

  <!-- Client 2 — top-right, DJ, R$2100 (HOT) -->
  <div class="absolute float" style="left:70%; top:24%; animation-delay:0.5s;">
    <div class="relative">
      <div class="px-2.5 py-1 rounded-lg flex items-center gap-1.5 mb-1" style="background:#dc2626; box-shadow:0 8px 20px -4px rgba(220,38,38,0.6);">
        <span class="text-[12px]">🔥</span>
        <span class="text-white text-[11px] font-extrabold">R$ 2.100</span>
      </div>
      <div class="w-9 h-9 rounded-full flex items-center justify-center mx-auto -mt-0.5" style="background:linear-gradient(135deg,#a855f7,#7c3aed); box-shadow:0 6px 16px -2px rgba(168,85,247,0.6), 0 0 0 3px rgba(255,255,255,0.9);">
        <span class="text-white font-bold text-[12px]">R</span>
      </div>
    </div>
  </div>

  <!-- Client 3 — left middle -->
  <div class="absolute float" style="left:10%; top:48%; animation-delay:1s;">
    <div class="relative">
      <div class="px-2.5 py-1 rounded-lg flex items-center gap-1.5 mb-1" style="background:#0B0B0F; border:1px solid rgba(255,255,255,0.1); box-shadow:0 8px 20px -4px rgba(0,0,0,0.6);">
        <span class="text-[14px]">🍸</span>
        <span class="text-white text-[11px] font-extrabold">R$ 480</span>
      </div>
      <div class="w-9 h-9 rounded-full flex items-center justify-center mx-auto -mt-0.5" style="background:linear-gradient(135deg,#10b981,#059669); box-shadow:0 6px 16px -2px rgba(16,185,129,0.6), 0 0 0 3px rgba(255,255,255,0.9);">
        <span class="text-white font-bold text-[12px]">F</span>
      </div>
    </div>
  </div>

  <!-- Client 4 — right middle -->
  <div class="absolute float" style="left:75%; top:48%; animation-delay:1.5s;">
    <div class="relative">
      <div class="px-2.5 py-1 rounded-lg flex items-center gap-1.5 mb-1" style="background:#0B0B0F; border:1px solid rgba(255,255,255,0.1); box-shadow:0 8px 20px -4px rgba(0,0,0,0.6);">
        <span class="text-[14px]">🎥</span>
        <span class="text-white text-[11px] font-extrabold">R$ 950</span>
      </div>
      <div class="w-9 h-9 rounded-full flex items-center justify-center mx-auto -mt-0.5" style="background:linear-gradient(135deg,#f43f5e,#e11d48); box-shadow:0 6px 16px -2px rgba(244,63,94,0.6), 0 0 0 3px rgba(255,255,255,0.9);">
        <span class="text-white font-bold text-[12px]">J</span>
      </div>
    </div>
  </div>

  <!-- Client 5 — bottom-left -->
  <div class="absolute float" style="left:22%; top:67%; animation-delay:0.8s;">
    <div class="relative">
      <div class="px-2.5 py-1 rounded-lg flex items-center gap-1.5 mb-1" style="background:#0B0B0F; border:1px solid rgba(255,255,255,0.1); box-shadow:0 8px 20px -4px rgba(0,0,0,0.6);">
        <span class="text-[14px]">💍</span>
        <span class="text-white text-[11px] font-extrabold">R$ 3.200</span>
      </div>
      <div class="w-9 h-9 rounded-full flex items-center justify-center mx-auto -mt-0.5" style="background:linear-gradient(135deg,#f59e0b,#d97706); box-shadow:0 6px 16px -2px rgba(245,158,11,0.6), 0 0 0 3px rgba(255,255,255,0.9);">
        <span class="text-white font-bold text-[12px]">P</span>
      </div>
    </div>
  </div>

  <!-- Client 6 — bottom-right -->
  <div class="absolute float" style="left:65%; top:70%; animation-delay:0.3s;">
    <div class="relative">
      <div class="px-2.5 py-1 rounded-lg flex items-center gap-1.5 mb-1" style="background:#0B0B0F; border:1px solid rgba(255,255,255,0.1); box-shadow:0 8px 20px -4px rgba(0,0,0,0.6);">
        <span class="text-[14px]">🎤</span>
        <span class="text-white text-[11px] font-extrabold">R$ 780</span>
      </div>
      <div class="w-9 h-9 rounded-full flex items-center justify-center mx-auto -mt-0.5" style="background:linear-gradient(135deg,#06b6d4,#0891b2); box-shadow:0 6px 16px -2px rgba(6,182,212,0.6), 0 0 0 3px rgba(255,255,255,0.9);">
        <span class="text-white font-bold text-[12px]">C</span>
      </div>
    </div>
  </div>

  <!-- Client 7 — far top -->
  <div class="absolute float" style="left:48%; top:18%; animation-delay:1.8s;">
    <div class="relative">
      <div class="w-9 h-9 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#8b5cf6,#6d28d9); box-shadow:0 6px 16px -2px rgba(139,92,246,0.6), 0 0 0 3px rgba(255,255,255,0.85);">
        <span class="text-white font-bold text-[12px]">A</span>
      </div>
    </div>
  </div>

  <!-- Right side controls -->
  <div class="absolute right-4 top-44 flex flex-col gap-2">
    <button class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background:rgba(255,255,255,0.97); box-shadow:0 8px 20px -4px rgba(0,0,0,0.4);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B0F" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 10v6M4.22 4.22l4.24 4.24m7.08 7.08l4.24 4.24M1 12h6m10 0h6M4.22 19.78l4.24-4.24m7.08-7.08l4.24-4.24"/></svg>
    </button>
    <button class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background:rgba(255,255,255,0.97); box-shadow:0 8px 20px -4px rgba(0,0,0,0.4);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B0F" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 01-2 2H9a2 2 0 01-2-2L5 6"/><path d="M10 11v6m4-6v6"/></svg>
    </button>
  </div>

  <!-- Bottom sheet card (selected client) -->
  <div class="absolute left-0 right-0 bottom-0 px-4 pb-6">
    <div class="rounded-3xl p-5" style="background:linear-gradient(180deg,#15151c 0%,#0B0B0F 100%); border:1px solid rgba(255,255,255,0.08); box-shadow:0 -20px 60px -10px rgba(0,0,0,0.7);">
      <div class="w-10 h-1 rounded-full bg-white/20 mx-auto mb-4"></div>
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white font-extrabold text-lg" style="background:linear-gradient(135deg,#dc2626,#7c2d12);">🔥</div>
        <div class="flex-1">
          <div class="flex items-center gap-1.5">
            <span class="px-1.5 py-0.5 rounded text-[9px] font-extrabold uppercase tracking-wider text-white" style="background:#dc2626;">URGENTE</span>
            <span class="text-[10px] text-white/50 font-medium">há 2 min</span>
          </div>
          <p class="text-white font-bold text-[14px] leading-tight mt-1">DJ — Festa corporativa hoje</p>
          <p class="text-white/50 text-[11px] flex items-center gap-1 mt-0.5">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/></svg>
            850m · 4 min de carro
          </p>
        </div>
      </div>
      <div class="flex items-center justify-between mt-4 pt-4 border-t border-white/10">
        <div>
          <p class="text-[9px] uppercase tracking-wider text-white/40 font-bold">Você recebe</p>
          <p class="text-[22px] font-extrabold text-white leading-none mt-0.5">R$ 2.100<span class="text-sm text-white/40">,00</span></p>
        </div>
        <button class="px-6 py-3 rounded-xl text-[13px] font-bold text-white flex items-center gap-2" style="background:#276EF1; box-shadow:0 10px 25px -6px rgba(39,110,241,0.6);">
          Aceitar
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
